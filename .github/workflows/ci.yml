name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }} --target-platform android-arm64,android-x64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 1

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-apks
          path: build/app/outputs/flutter-apk
      - name: Check offline APK policies
        run: |
          for apk in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk; do
            tool/check_no_internet.sh "$apk"
            tool/check_no_models.sh "$apk"
          done

  sign:
    needs: [analyze, test, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Release keystore secrets are not configured"
            exit 1
          fi
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-apks
          path: build/app/outputs/flutter-apk
      - name: Sign release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -printf '%p\n' | sort -V | tail -n 1)"
          if [[ -z "$apksigner_bin" || ! -x "$apksigner_bin" ]]; then
            echo "apksigner not found under $ANDROID_HOME/build-tools" >&2
            exit 2
          fi

          signed_dir="$RUNNER_TEMP/signed-apks"
          mkdir -p "$signed_dir"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            signed_apk="$signed_dir/$(basename "$apk")"
            "$apksigner_bin" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed_apk" \
              "$apk"
          done
      - name: Verify signed APKs
        run: |
          for apk in "$RUNNER_TEMP"/signed-apks/app-*-release.apk; do
            tool/check_release_signing.sh "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rexorder-release-apks
          path: ${{ runner.temp }}/signed-apks/app-*-release.apk
      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
